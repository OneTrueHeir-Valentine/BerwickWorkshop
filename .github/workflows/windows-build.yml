name: Verify Windows build

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Review public copy
        shell: powershell
        run: ./tools/check-public-copy.ps1
      - name: Run local checks in Windows PowerShell
        shell: powershell
        run: ./tools/run-local-checks.ps1
      - name: Run local checks in PowerShell 7
        shell: pwsh
        run: ./tools/run-local-checks.ps1
      - name: Publish Windows executable
        shell: pwsh
        run: |
          dotnet publish App -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o "$env:RUNNER_TEMP\Berwick Workshop"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "$env:RUNNER_TEMP\Berwick Workshop\Berwick Workshop.exe")) { throw "Executable missing" }
      - name: Upload verified executable
        uses: actions/upload-artifact@v4
        with:
          name: Berwick-Workshop-Windows
          path: ${{ runner.temp }}/Berwick Workshop/Berwick Workshop.exe
          if-no-files-found: error
